# ============================================================================
# ocr-service - OCR Platform
# ----------------------------------------------------------------------------
# Microservice Python qui consomme les events documents.uploaded depuis Kafka,
# extrait le texte (OCR), persiste en PostgreSQL et publie documents.ocr.completed.
# ============================================================================

[project]
name = "ocr-service"
version = "0.1.0"
description = "OCR microservice - extracts text from documents via Tesseract/PaddleOCR"
requires-python = ">=3.12"
authors = [
    { name = "Issa Seck Kane", email = "issaseckkane@gmail.com" }
]

# ----------------------------------------------------------------------------
# Dependances runtime (= Maven scope compile/runtime)
# Pour Phase 8.1 : juste FastAPI. On ajoutera kafka/sqlalchemy/minio plus tard.
# ----------------------------------------------------------------------------
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",  # serveur ASGI prod-ready

    # Configuration 12-factor (equivalent @ConfigurationProperties Spring)
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

# ----------------------------------------------------------------------------
# Dependances dev/test (= Maven scope test)
# Active avec : uv sync --group dev
# ----------------------------------------------------------------------------
[dependency-groups]
dev = [
    # Tests
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",  # client HTTP async pour tester FastAPI

    # Qualite (equivalent SpotBugs + Checkstyle)
    "ruff>=0.7.0",     # linter + formatter (remplace flake8 + black + isort)
    "mypy>=1.13.0",    # type checking statique
]

# ============================================================================
# Build system (uv utilise hatchling par defaut)
# ============================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ============================================================================
# Configuration outils qualite
# ============================================================================

# ----- Ruff : linter + formatter ultra-rapide -----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# Selection raisonnable de regles (equivalent Checkstyle Google)
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (imports tries)
    "B",   # flake8-bugbear (bugs courants)
    "UP",  # pyupgrade (syntaxe Python moderne)
    "N",   # pep8-naming
    "SIM", # simplifications
]
ignore = [
    "E501",  # line too long (gere par formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----- Mypy : type checking -----
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true  # tolerant pour les libs sans stubs

# ----- Pytest : tests -----
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"  # pytest-asyncio en mode auto
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",  # affiche un resume des tests skipped/failed
]

# ----- Coverage -----
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/__init__.py",
    "*/tests/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
