# ============================================================================
# document-service — Profile DEV
# ----------------------------------------------------------------------------
# Configuration specifique au developpement local.
# Cible l'infrastructure Docker locale (docker-compose.infra.yml) :
#   - MySQL    : localhost:3306
#   - Kafka    : localhost:29092 (listener externe)
#   - MinIO    : localhost:9000
#   - Keycloak : localhost:8180
#
# IMPORTANT : les credentials hardcodes ici sont OK car ils correspondent
# aux defauts Docker de l'infra locale uniquement. Jamais utilises en prod.
# ============================================================================

spring:
  # --------------------------------------------------------------------------
  # DataSource — MySQL local (Docker)
  # --------------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://localhost:3306/documents_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ocr_user
    password: ocr_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: DocumentServiceHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # --------------------------------------------------------------------------
  # JPA — verbose en dev pour debug
  # --------------------------------------------------------------------------
  jpa:
    show-sql: false
    properties:
      hibernate:
        # SQL formate (lisible) — uniquement en dev
        format_sql: true

  # --------------------------------------------------------------------------
  # Flyway — migrations BDD
  # --------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    # baseline-on-migrate=true : utile en dev si on ajoute Flyway sur une BDD existante
    # En staging/prod : false (on ne veut pas Flyway qui "saute" des migrations)
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # --------------------------------------------------------------------------
  # Security — OAuth2 Resource Server (Keycloak local)
  # --------------------------------------------------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ocr-platform
          jwk-set-uri: http://localhost:8180/realms/ocr-platform/protocol/openid-connect/certs

  # --------------------------------------------------------------------------
  # Kafka — listener externe (depuis machine hote)
  # --------------------------------------------------------------------------
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: document-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ocrplatform.*"

# ============================================================================
# Logs (verbeux en dev)
# ============================================================================
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.springframework.kafka: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
    org.springframework.web.servlet.DispatcherServlet: WARN

# ============================================================================
# Stockage objet (MinIO local via docker-compose.infra.yml)
# ============================================================================
storage:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: documents

# ============================================================================
# Topics Kafka (noms centralises)
# ============================================================================
ocr:
  kafka:
    topics:
      document-uploaded: documents.uploaded
