# ============================================================================
# document-service — Configuration commune (tous profiles)
# ----------------------------------------------------------------------------
# Ce fichier ne contient QUE les paramètres strictement identiques sur
# tous les environnements (dev, test, staging, prod).
# Les paramètres specifiques sont dans application-{profile}.yml :
#   - application-dev.yml      -> developpement local (Docker compose)
#   - application-test.yml     -> tests d'integration (Testcontainers)
#   - application-staging.yml  -> environnement de pre-production (VPS)
#   - application-prod.yml     -> production (VPS)
#
# Profile actif : determine par la variable d'env SPRING_PROFILES_ACTIVE.
# Fallback : "dev" pour le confort en local. En prod, OBLIGATOIRE de definir
# explicitement SPRING_PROFILES_ACTIVE=prod (sinon fail-fast au demarrage).
# ============================================================================

spring:
  # --------------------------------------------------------------------------
  # Identite de l'application
  # --------------------------------------------------------------------------
  application:
    name: document-service

  # --------------------------------------------------------------------------
  # Profile actif
  # --------------------------------------------------------------------------
  # Pattern senior : variable d'env override le defaut.
  # En dev local : aucune variable -> "dev" est utilise.
  # En staging/prod : SPRING_PROFILES_ACTIVE=staging (ou prod) defini par Docker.
  # --------------------------------------------------------------------------
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # --------------------------------------------------------------------------
  # JPA / Hibernate (configuration commune a tous les environnements)
  # --------------------------------------------------------------------------
  jpa:
    # Hibernate ne genere JAMAIS le schema BDD : c'est Flyway qui s'en occupe.
    # 'validate' = Hibernate verifie juste que le schema BDD correspond aux entites.
    hibernate:
      ddl-auto: validate
    # Desactive la "open session in view" (anti-pattern lent)
    open-in-view: false
    properties:
      hibernate:
        # Timezone explicite pour eviter les soucis de TZ entre app et BDD
        jdbc:
          time_zone: UTC

  # --------------------------------------------------------------------------
  # Upload de fichiers (limites communes)
  # --------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

# ============================================================================
# Server (Tomcat embarque)
# ============================================================================
server:
  port: 8081

# ============================================================================
# Actuator — Endpoints de monitoring (configuration de base)
# ----------------------------------------------------------------------------
# /actuator/health     -> status de l'app (liveness + readiness)
# /actuator/info       -> infos de build
# /actuator/metrics    -> metriques (micrometer)
# /actuator/prometheus -> format Prometheus
#
# NOTE : la liste des endpoints exposes peut etre restreinte par profil
# (ex: en prod, on cache /metrics derriere un port management separe).
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: document-service

# ============================================================================
# OpenAPI / Swagger UI
# ============================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
