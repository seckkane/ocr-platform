# ============================================================================
# CI Pipeline — document-service (Java/Spring Boot)
# ----------------------------------------------------------------------------
# Pourquoi un workflow PAR service (et pas un global) :
# - Push sur document-service ne lance pas la CI d'ocr-service (paths filter)
# - Lisibilite : chaque fichier est dedie a son service
# - Standard monorepo (Google, Meta, Uber)
#
# Quand on aura ocr-service et search-service, on creera :
#   - ocr-service-ci.yml
#   - search-service-ci.yml
#   - platform-e2e.yml (tests end-to-end de TOUS les services ensemble)
# ============================================================================

name: document-service CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/document-service/**'
      - '.github/workflows/document-service-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/document-service/**'
      - '.github/workflows/document-service-ci.yml'

permissions:
  contents: read

concurrency:
  group: document-service-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make mvnw executable
        working-directory: services/document-service
        run: chmod +x mvnw

      - name: Run tests with Maven
        working-directory: services/document-service
        run: ./mvnw -B clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-document-service
          path: services/document-service/target/surefire-reports/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks (secrets detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/document-service
          severity: CRITICAL,HIGH
          exit-code: 0
          format: table