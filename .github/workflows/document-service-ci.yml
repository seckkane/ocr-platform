# ============================================================================
# CI Pipeline — document-service (Java/Spring Boot)
# ----------------------------------------------------------------------------
# Strategie senior : on adapte la rigueur au contexte
#
#   Push develop/main       -> test + secrets-scan          (rapide ~3 min)
#   Pull Request            -> test + quality + secrets     (~5 min)
#   Cron nightly (2h UTC)   -> test + quality + security    (~10 min)
#   Manual dispatch         -> tout, a la demande
#
# Caches : Maven repo, NVD database (OWASP)
# Concurrency : annule les anciens runs sur la meme branche
# ============================================================================

name: document-service CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/document-service/**'
      - '.github/workflows/document-service-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/document-service/**'
      - '.github/workflows/document-service-ci.yml'
  schedule:
    # Tous les jours a 2h du matin UTC (3h Paris)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Permet de lancer manuellement depuis l'UI GitHub
    inputs:
      run_security:
        description: 'Run OWASP security scan'
        required: false
        default: 'false'

# Permissions minimales par defaut (principe du moindre privilege)
permissions:
  contents: read

# Annule les anciennes executions si on push de nouveau sur la meme branche
concurrency:
  group: document-service-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIR: services/document-service
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:

  # ==========================================================================
  # JOB 1 : Detection de secrets (rapide, sur tous les push/PR)
  # ==========================================================================
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessaire pour scanner tout l'historique

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # JOB 2 : Tests (toujours)
  # ==========================================================================
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Make mvnw executable
        working-directory: ${{ env.WORKING_DIR }}
        run: chmod +x mvnw

      - name: Run tests with Maven
        working-directory: ${{ env.WORKING_DIR }}
        run: ./mvnw -B clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: ${{ env.WORKING_DIR }}/target/site/jacoco/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            ${{ env.WORKING_DIR }}/target/surefire-reports/
            ${{ env.WORKING_DIR }}/target/failsafe-reports/
          retention-days: 7

  # ==========================================================================
  # JOB 3 : Qualite (uniquement sur PR)
  # ==========================================================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Make mvnw executable
        working-directory: ${{ env.WORKING_DIR }}
        run: chmod +x mvnw

      - name: Run quality checks (SpotBugs + Checkstyle)
        working-directory: ${{ env.WORKING_DIR }}
        run: ./mvnw -B verify -P quality -DskipTests

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: ${{ env.WORKING_DIR }}/target/spotbugsXml.xml
          retention-days: 7

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-report
          path: ${{ env.WORKING_DIR }}/target/checkstyle-result.xml
          retention-days: 7

  # ==========================================================================
  # JOB 4 : Securite (cron nightly + manual dispatch)
  # ==========================================================================
  security:
    name: Security Scan (OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_security == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # Cache la base NVD (CVE database, ~300 MB)
      # Sans ca, OWASP retelecharge tout a chaque run = 5-10 min perdues
      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Make mvnw executable
        working-directory: ${{ env.WORKING_DIR }}
        run: chmod +x mvnw

      - name: Run OWASP Dependency-Check
        working-directory: ${{ env.WORKING_DIR }}
        run: ./mvnw -B verify -P security -DskipTests

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          path: |
            ${{ env.WORKING_DIR }}/target/dependency-check-report.html
            ${{ env.WORKING_DIR }}/target/dependency-check-report.json
          retention-days: 30

  # ==========================================================================
  # JOB 5 : Trivy filesystem scan (rapide, toujours)
  # ==========================================================================
  trivy-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ env.WORKING_DIR }}
          severity: CRITICAL,HIGH
          exit-code: 0  # Warn-only au demarrage. Plus tard : 1.
          format: table
