# ============================================================================
# Deploy Staging — Build & Push Docker image to GHCR
# ----------------------------------------------------------------------------
# Workflow declenche sur :
#   - push sur develop  -> build + tag 'develop' + push sur GHCR
#   - manual dispatch   -> build manuel a la demande
#
# Phase actuelle (B.3) : build + push image. PAS de deploy VPS automatique.
# Phase future  (B.4)  : SSH sur VPS Contabo + docker pull + restart compose.
#
# Image publiee sur :
#   ghcr.io/seckkane/ocr-platform/document-service:develop
#   ghcr.io/seckkane/ocr-platform/document-service:develop-<sha>
# ============================================================================

name: Deploy Staging

on:
  push:
    branches: [develop]
    paths:
      - 'services/document-service/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:
    # Permet de declencher manuellement depuis l'UI GitHub
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual rebuild'

# Permissions minimales necessaires :
#   contents: read    -> checkout du code
#   packages: write   -> push image sur GHCR
permissions:
  contents: read
  packages: write

# Annule les anciens runs sur la meme branche (eviter builds concurrents)
concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Image name = ghcr.io/<owner>/<repo>/document-service
  # En lowercase obligatoire pour Docker
  IMAGE_NAME: ${{ github.repository }}/document-service

jobs:

  # ==========================================================================
  # JOB : Build l'image et push sur GHCR
  # ==========================================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ----------------------------------------------------------------------
      # 1. Checkout du code
      # ----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # 2. Setup Docker Buildx (build engine moderne avec cache distribue)
      # ----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------------------
      # 3. Login GHCR avec le GITHUB_TOKEN (auto-fourni)
      # ----------------------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # 4. Extraire les metadata (tags + labels OCI)
      # ----------------------------------------------------------------------
      # Tags generes :
      #   - 'develop'                          (toujours = derniere develop)
      #   - 'develop-<short-sha>'              (pour rollback potentiel)
      # ----------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short
          labels: |
            org.opencontainers.image.title=document-service
            org.opencontainers.image.description=OCR Platform - Document service
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ----------------------------------------------------------------------
      # 5. Build & Push de l'image
      # ----------------------------------------------------------------------
      # cache-from / cache-to : reutilise les layers entre builds
      # (sans cache, chaque build re-telecharge toutes les deps Maven = lent)
      # ----------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./services/document-service
          file: ./services/document-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # ----------------------------------------------------------------------
      # 6. Resume final dans le job summary
      # ----------------------------------------------------------------------
      - name: Output image info
        run: |
          echo "## Docker Image Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed to GHCR:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
